name: Deploy Backend

on:
  push:
    branches:
      - docker-cicd
    paths:
      - "circle-server/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -f circle-server/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/circle-api:latest \
            ./circle-server

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/circle-api:latest

      - name: Copy Docker Compose File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SECRET }}
          source: "circle-server/docker-compose.yml"
          target: "/home/ubuntu/circle-api"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SECRET }}
          script: |
            mkdir -p ~/circle-api

            cd ~/circle-api

            docker compose -f docker-compose.yml pull

            docker compose -f docker-compose.yml up -d