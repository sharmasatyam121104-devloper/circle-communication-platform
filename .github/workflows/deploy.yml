name: Deploy Backend

on:
  push:
    branches:
      - docker-cicd
    paths:
      - "circle-server/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build \
            -f circle-server/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/circle-api:latest \
            ./circle-server

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/circle-api:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SECRET }}
          script: |
            cd ~/circle-api

            docker compose pull
            docker compose up -d